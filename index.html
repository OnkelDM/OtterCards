<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>OtterCards</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f7ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#05070d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OtterCards">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f4f7ff; --fg:#0b1020; --muted:#5b6478; --panel:#ffffff; --line:#e3e8f4; --soft:#eaf0ff;
  --accent:#2563eb; --accent-fg:#ffffff; --danger:#dc2626; --radius:18px;
  --shadow:0 1px 2px rgba(11,16,32,.06),0 6px 20px rgba(37,99,235,.08);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#05070d; --fg:#f5f7ff; --muted:#8b95ab; --panel:#0f1420; --line:#1b2438; --soft:#13203f; --accent:#3b82f6; --accent-fg:#ffffff; --danger:#f87171; --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 20px rgba(0,0,0,.35); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:720px;margin:0 auto;min-height:100%;padding-bottom:calc(96px + var(--safe-b))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;gap:10px;align-items:center}
header.top .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
header.top .brand img{width:38px;height:38px;border-radius:10px;image-rendering:pixelated;box-shadow:0 0 0 1px var(--line)}
header.top h1{font-size:26px;margin:0;font-weight:800;letter-spacing:-.8px}
header.top h1 b{color:var(--accent);font-weight:800}
.iconbtn{border:0;background:var(--panel);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px;box-shadow:var(--shadow);color:var(--fg)}
.search{padding:0 16px 8px}
.search input{width:100%;padding:12px 18px;border-radius:999px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);outline:none}
.search input:focus{border-color:var(--accent)}
.banner{margin:6px 16px;padding:12px 14px;border-radius:16px;background:var(--soft);border:1px solid var(--line);display:flex;gap:10px;align-items:center;font-size:14px}
.banner p{margin:0;flex:1}
.banner button{border:0;background:transparent;color:var(--accent);font-weight:600;padding:6px}
.section-h{padding:16px 22px 6px;font-size:12px;font-weight:800;color:var(--accent);letter-spacing:1.2px}
.rows{margin:0 16px;background:var(--panel);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left}
.row:last-child{border-bottom:0}
.row .tile{width:58px;height:37px;border-radius:7px;flex:none;font-size:11px}
.row .name{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .chev{color:var(--accent);font-weight:700}
.row{color:var(--fg)}
.row:active{background:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:8px 16px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.grid .face{width:100%;border:0}
.face{position:relative;aspect-ratio:1.586;border-radius:16px;overflow:hidden;display:grid;place-items:center;background-size:cover;background-position:center;color:#fff;box-shadow:0 0 0 1px rgba(128,140,170,.22),0 2px 10px rgba(5,7,13,.28)}
.face img.logo{max-width:46%;max-height:46%;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3));background:rgba(255,255,255,.92);padding:6px;border-radius:8px}
.face .label{position:absolute;left:10px;right:10px;bottom:8px;font-weight:700;font-size:14px;text-shadow:0 1px 3px rgba(0,0,0,.45);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.face .initial{font-size:22px;font-weight:800;opacity:.9}
.face.dark .label{color:#111;text-shadow:none}
.face.dark{color:#111}
.tile .label{display:none}
.tile img.logo{padding:2px;border-radius:4px}
.tile .initial{font-size:16px}
.empty{text-align:center;color:var(--muted);padding:56px 28px}
.empty h2{color:var(--fg);margin:0 0 8px;font-size:24px;letter-spacing:-.5px}
.empty img{width:112px;height:112px;border-radius:26px;image-rendering:pixelated;margin-bottom:18px;box-shadow:var(--shadow)}
.fab{position:fixed;right:max(18px,calc(50% - 342px));bottom:calc(20px + var(--safe-b));width:62px;height:62px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);font-size:34px;line-height:1;box-shadow:0 8px 24px rgba(37,99,235,.5);z-index:6}
.overlay{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
.overlay .bar{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(10px + var(--safe-t)) 12px 10px;z-index:2}
.overlay .bar h2{flex:1;margin:0;font-size:18px;text-align:center}
.textbtn{border:0;background:transparent;color:var(--accent);font-weight:700;padding:8px 10px;font-size:16px}
.textbtn.danger{color:var(--danger)}
.content{padding:6px 16px calc(40px + var(--safe-b));max-width:640px;margin:0 auto}
.detail .face{width:100%;margin-bottom:16px}
.codebox{background:#fff;color:#000;border-radius:var(--radius);padding:18px 14px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--line)}
.codebox svg{display:block;width:100%;height:auto;max-height:46vh}
.codebox .num{font:600 20px/1.3 ui-monospace,Menlo,Consolas,monospace;margin-top:10px;word-break:break-all;letter-spacing:1px}
.codebox.k-qr svg{max-width:min(100%,380px);margin:0 auto}
.meta{margin:14px 2px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:4px}
.meta a{color:var(--accent)}
.actions{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;border:1px solid var(--line);background:var(--panel);padding:13px 14px;border-radius:14px;font-weight:700;color:var(--fg);box-shadow:var(--shadow)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent;box-shadow:0 6px 16px rgba(37,99,235,.35)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5}
form .field{margin:14px 0}
form label{display:block;font-size:12px;font-weight:700;letter-spacing:.3px;color:var(--muted);margin:0 0 5px 2px}
form input[type=text],form input[type=url],form input[type=search],form select{width:100%;padding:13px 15px;border-radius:14px;border:1px solid var(--line);background:var(--panel);outline:none}
form input:focus,form select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.18)}
form input[type=color]{width:56px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:2px}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:11px;font-weight:700;font-size:14px;color:var(--fg)}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.seg button:disabled{opacity:.4}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 140px}
.photo-prev{margin-top:10px;display:flex;gap:10px;align-items:center}
.photo-prev img{width:96px;aspect-ratio:1.586;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.hint{font-size:13px;color:var(--muted);margin:6px 2px}
.err{color:var(--danger);font-size:13px;margin:6px 2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{color:var(--fg);border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font:600 15px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.5px}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.sheet-bg{position:fixed;inset:0;background:rgba(5,7,13,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;background:var(--panel);border-radius:26px 26px 0 0;padding:16px 14px calc(14px + var(--safe-b));color:var(--fg)}
.sheet h3{margin:4px 6px 8px;font-size:17px}
.sheet p{margin:4px 6px 10px;color:var(--muted);font-size:14px;white-space:pre-line}
.sheet button.item{display:block;width:100%;text-align:left;border:0;background:transparent;padding:15px 8px;font-size:16px;font-weight:600;color:var(--fg);border-top:1px solid var(--line)}
.sheet button.item.danger{color:var(--danger)}
.sheet button.item.on::after{content:" ✓";color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + var(--safe-b));background:#05070d;color:#fff;border:1px solid #1b2438;padding:11px 18px;border-radius:999px;z-index:50;font-size:14px;max-width:90%;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.scanner video{width:100%;max-height:70vh;background:#000;border-radius:12px}
.cropwrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px 16px calc(24px + var(--safe-b))}
.cropstage{position:relative;line-height:0;touch-action:none;user-select:none;-webkit-user-select:none;padding:22px}
.cropinner{position:relative;overflow:hidden;border-radius:8px;line-height:0}
.cropview{display:block}
.cropframe{position:absolute;box-shadow:0 0 0 9999px rgba(5,7,13,.62);border:2px solid #fff;touch-action:none;cursor:move;border-radius:3px}
.crophandles{position:absolute;left:22px;top:22px;pointer-events:none}
.crophandles .hb{position:absolute}
.crophandles i{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;touch-action:none;pointer-events:auto}
.crophandles i::after{content:'';position:absolute;left:14px;top:14px;width:16px;height:16px;background:#fff;border-radius:50%;box-shadow:0 0 0 3px var(--accent)}
.crophandles i[data-h=nw]{left:0;top:0}.crophandles i[data-h=n]{left:50%;top:0}.crophandles i[data-h=ne]{left:100%;top:0}.crophandles i[data-h=e]{left:100%;top:50%}
.crophandles i[data-h=se]{left:100%;top:100%}.crophandles i[data-h=s]{left:50%;top:100%}.crophandles i[data-h=sw]{left:0;top:100%}.crophandles i[data-h=w]{left:0;top:50%}
.legal{text-align:center;color:var(--muted);font-size:13px;margin:26px 16px 0}
.legal a{color:var(--muted);text-decoration:underline;padding:6px 4px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app" id="app"></div>
<input type="file" id="fileCamera" accept="image/*" capture="environment" class="hidden">
<input type="file" id="fileLibrary" accept="image/*" class="hidden">
<input type="file" id="fileImport" accept=".json,application/json" class="hidden">

<script>
/* =====================================================================
   OtterCards – Codes erzeugen (QR, Code 128, EAN-13/8, UPC-A, Code 39, ITF)
   Alles ohne externe Bibliotheken.
   ===================================================================== */
const WCodes = (() => {
  /* ---------- QR-Code ---------- */
  const ECC = {
    L: { bits: 1,
      ecc:    [-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
      blocks: [-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25] },
    M: { bits: 0,
      ecc:    [-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28],
      blocks: [-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49] },
  };
  const bit = (x, i) => ((x >>> i) & 1) !== 0;
  function mulGF(x, y) { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z; }
  function rsDivisor(deg) {
    const r = new Array(deg).fill(0); r[deg - 1] = 1; let root = 1;
    for (let i = 0; i < deg; i++) { for (let j = 0; j < deg; j++) { r[j] = mulGF(r[j], root); if (j + 1 < deg) r[j] ^= r[j + 1]; } root = mulGF(root, 2); }
    return r;
  }
  function rsRemainder(data, div) {
    const r = div.map(() => 0);
    for (const b of data) { const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => { r[i] ^= mulGF(c, f); }); }
    return r;
  }
  function rawModules(ver) {
    let r = (16 * ver + 128) * ver + 64;
    if (ver >= 2) { const n = Math.floor(ver / 7) + 2; r -= (25 * n - 10) * n - 55; if (ver >= 7) r -= 36; }
    return r;
  }
  function alignPositions(ver) {
    if (ver === 1) return [];
    const n = Math.floor(ver / 7) + 2, size = ver * 4 + 17;
    const step = ver === 32 ? 26 : Math.ceil((ver * 4 + 4) / (n * 2 - 2)) * 2;
    const res = [6];
    for (let pos = size - 7; res.length < n; pos -= step) res.splice(1, 0, pos);
    return res;
  }
  function interleave(data, ver, E) {
    const nb = E.blocks[ver], el = E.ecc[ver], raw = Math.floor(rawModules(ver) / 8);
    const nShort = nb - raw % nb, shortLen = Math.floor(raw / nb);
    const div = rsDivisor(el), blocks = [];
    for (let i = 0, k = 0; i < nb; i++) {
      const dat = data.slice(k, k + shortLen - el + (i < nShort ? 0 : 1)); k += dat.length;
      const ecc = rsRemainder(dat, div);
      if (i < nShort) dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    const out = [];
    for (let i = 0; i < blocks[0].length; i++)
      blocks.forEach((b, j) => { if (i !== shortLen - el || j >= nShort) out.push(b[i]); });
    return out;
  }
  function qrMatrix(text, level = 'M') {
    const E = ECC[level];
    const bytes = Array.from(new TextEncoder().encode(text));
    let ver, cap = 0;
    for (ver = 1; ver <= 40; ver++) {
      cap = Math.floor(rawModules(ver) / 8) - E.ecc[ver] * E.blocks[ver];
      if (4 + (ver <= 9 ? 8 : 16) + bytes.length * 8 <= cap * 8) break;
    }
    if (ver > 40) throw new Error('Inhalt ist für einen QR-Code zu lang.');
    const bits = [];
    const push = (v, n) => { for (let i = n - 1; i >= 0; i--) bits.push((v >>> i) & 1); };
    push(4, 4); push(bytes.length, ver <= 9 ? 8 : 16); bytes.forEach(b => push(b, 8));
    push(0, Math.min(4, cap * 8 - bits.length));
    push(0, (8 - bits.length % 8) % 8);
    for (let pad = 0xEC; bits.length < cap * 8; pad ^= 0xEC ^ 0x11) push(pad, 8);
    const data = [];
    for (let i = 0; i < bits.length; i += 8) { let v = 0; for (let j = 0; j < 8; j++) v = (v << 1) | bits[i + j]; data.push(v); }
    const codewords = interleave(data, ver, E);

    const size = ver * 4 + 17;
    const mod = Array.from({ length: size }, () => new Array(size).fill(false));
    const fn = Array.from({ length: size }, () => new Array(size).fill(false));
    const setFn = (x, y, v) => { mod[y][x] = v; fn[y][x] = true; };
    for (let i = 0; i < size; i++) { setFn(6, i, i % 2 === 0); setFn(i, 6, i % 2 === 0); }
    const finder = (cx, cy) => {
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
        const d = Math.max(Math.abs(dx), Math.abs(dy)), x = cx + dx, y = cy + dy;
        if (x >= 0 && x < size && y >= 0 && y < size) setFn(x, y, d !== 2 && d !== 4);
      }
    };
    finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
    const ap = alignPositions(ver), na = ap.length;
    for (let i = 0; i < na; i++) for (let j = 0; j < na; j++) {
      if ((i === 0 && j === 0) || (i === 0 && j === na - 1) || (i === na - 1 && j === 0)) continue;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++)
        setFn(ap[i] + dx, ap[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }
    const drawFormat = (mask) => {
      const d = (E.bits << 3) | mask; let rem = d;
      for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
      const b = ((d << 10) | rem) ^ 0x5412;
      for (let i = 0; i <= 5; i++) setFn(8, i, bit(b, i));
      setFn(8, 7, bit(b, 6)); setFn(8, 8, bit(b, 7)); setFn(7, 8, bit(b, 8));
      for (let i = 9; i < 15; i++) setFn(14 - i, 8, bit(b, i));
      for (let i = 0; i < 8; i++) setFn(size - 1 - i, 8, bit(b, i));
      for (let i = 8; i < 15; i++) setFn(8, size - 15 + i, bit(b, i));
      setFn(8, size - 8, true);
    };
    drawFormat(0);
    if (ver >= 7) {
      let rem = ver;
      for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
      const b = (ver << 12) | rem;
      for (let i = 0; i < 18; i++) { const c = bit(b, i), a = size - 11 + i % 3, s = Math.floor(i / 3); setFn(a, s, c); setFn(s, a, c); }
    }
    // Daten-Module setzen
    let k = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++) {
        const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - vert : vert;
        if (!fn[y][x] && k < codewords.length * 8) { mod[y][x] = bit(codewords[k >>> 3], 7 - (k & 7)); k++; }
      }
    }
    const applyMask = (m) => {
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
        let inv;
        switch (m) {
          case 0: inv = (x + y) % 2 === 0; break;
          case 1: inv = y % 2 === 0; break;
          case 2: inv = x % 3 === 0; break;
          case 3: inv = (x + y) % 3 === 0; break;
          case 4: inv = (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0; break;
          case 5: inv = x * y % 2 + x * y % 3 === 0; break;
          case 6: inv = (x * y % 2 + x * y % 3) % 2 === 0; break;
          default: inv = ((x + y) % 2 + x * y % 3) % 2 === 0;
        }
        if (!fn[y][x] && inv) mod[y][x] = !mod[y][x];
      }
    };
    const penalty = () => {
      let p = 0;
      const line = (get) => {
        for (let a = 0; a < size; a++) {
          let run = 1, s = '';
          for (let b = 0; b < size; b++) {
            const v = get(a, b); s += v ? '1' : '0';
            if (b > 0 && v === get(a, b - 1)) { run++; if (run === 5) p += 3; else if (run > 5) p++; } else run = 1;
          }
          const m = s.match(/(?=(00001011101|10111010000))/g); if (m) p += 40 * m.length;
        }
      };
      line((r, c) => mod[r][c]); line((r, c) => mod[c][r]);
      for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++) {
        const c = mod[y][x]; if (c === mod[y][x + 1] && c === mod[y + 1][x] && c === mod[y + 1][x + 1]) p += 3;
      }
      let dark = 0; for (const r of mod) for (const c of r) if (c) dark++;
      const tot = size * size; p += (Math.ceil(Math.abs(dark * 20 - tot * 10) / tot) - 1) * 10;
      return p;
    };
    let best = 0, bestP = Infinity;
    for (let m = 0; m < 8; m++) {
      applyMask(m); drawFormat(m);
      const p = penalty(); if (p < bestP) { bestP = p; best = m; }
      applyMask(m);
    }
    applyMask(best); drawFormat(best);
    return mod;
  }

  /* ---------- 1D-Barcodes (liefern Bitstring, "1" = Balken) ---------- */

      else { chooseNumber(nums[0]); toast(nums.length > 1 ? 'Zahl im Foto gelesen – bitte prüfen. Weitere Vorschläge unter „Nummer“.' : 'Zahl im Foto gelesen – bitte mit der Karte vergleichen.', 6500); }
    } catch (e) { toast('Zahlenerkennung fehlgeschlagen: ' + (e && e.message || e) + ' – Menü → Diagnose zeigt mehr.', 9000); }
    draw();
  }
  function chooseNumber(n) { d.number = n; if (d.display === 'number') d.display = 'barcode'; if (d.display === 'barcode') d.format = formatForNumber(n); }
  async function pickFile(input) {
    input.value = ''; input.onchange = async () => {
      const f = input.files && input.files[0]; if (!f) return;
      let photo;
      try {
        const bmp = await loadBitmap(f), cv = await cropPhoto(bmp);
        if (!cv) return;
        photo = { dataUrl: scaledCanvas(cv, 1280).toDataURL('image/jpeg', 0.82), source: cv };
      } catch (e) { toast('Foto konnte nicht verarbeitet werden.', 4000); return; }
      d.photo = photo.dataUrl; d.design = 'photo'; ocrCands = []; draw();
      toast('Foto gespeichert – suche nach Code …', 8000);
      let hit = null, scannerOk = true, scanErr = null;
      try { hit = await detectInImage(photo.source); } catch (e) { scannerOk = false; scanErr = e; }
      if (hit && hit.format) { const note = applyDetected(d, hit); toast(note || 'Code im Foto erkannt.', note ? 6500 : 2600); draw(); return; }
      if (hit) { applyDetected(d, hit); }   // Code-Typ nicht nachbaubar: Zahl übernehmen, danach nicht noch Zahlen suchen
      if (hit) { toast(`${hit.label}-Code erkannt. Die Nummer wurde übernommen und wird als Text angezeigt.`, 6500); draw(); return; }
      toast('Kein Code gefunden – lese Zahlen im Foto …', 20000);
      await findNumbers(photo.source, scannerOk ? null : scanErr);
    };
    input.click();
  }
  function draw() {
    const sy = ov.scrollTop;
    root.replaceChildren();
    // Foto
    root.append(h('div', { class: 'field' }, h('label', {}, 'Foto der Karte'),
      h('div', { class: 'btnrow' },
        h('button', { type: 'button', class: 'btn', onclick: () => pickFile($('#fileCamera')) }, '📷 Foto aufnehmen'),
        h('button', { type: 'button', class: 'btn', onclick: () => pickFile($('#fileLibrary')) }, '🖼 Aus Mediathek'),
        h('button', { type: 'button', class: 'btn', onclick: () => openScanner(hit => { const note = applyDetected(d, hit); draw(); toast(note || 'Code gescannt.', note ? 6500 : 2600); }) }, '⌖ Live scannen')),
      h('div', { class: 'hint' }, 'Tipp: Foto der Karte machen oder live scannen – Barcode bzw. QR-Code wird automatisch gelesen.'),
      d.photo && h('div', { class: 'photo-prev' }, h('img', { src: d.photo, alt: 'Kartenfoto' }), h('div', { style: 'display:flex;flex-direction:column;align-items:flex-start' }, h('button', { type: 'button', class: 'textbtn', onclick: async () => { toast('Lese Zahlen im Foto …', 20000); const img = new Image(); img.src = d.photo; try { await img.decode(); } catch {} await findNumbers(img, null); } }, '🔢 Zahl im Foto suchen'), h('button', { type: 'button', class: 'textbtn', onclick: async () => { const img = new Image(); img.src = d.photo; try { await img.decode(); } catch {} const cv = await cropPhoto(img); if (cv) { d.photo = scaledCanvas(cv, 1280).toDataURL('image/jpeg', 0.82); draw(); } } }, '✂ Zuschneiden'), h('button', { type: 'button', class: 'textbtn danger', onclick: () => { d.photo = ''; d.design = 'color'; ocrCands = []; draw(); } }, 'Foto entfernen')))));
    root.append(h('div', { class: 'field' }, h('label', { for: 'f-name' }, 'Name'), h('input', { id: 'f-name', type: 'text', value: d.name, placeholder: 'z. B. dm, Rewe, Payback', autocomplete: 'off', oninput: e => d.name = e.target.value })));
    root.append(h('div', { class: 'field' }, h('label', { for: 'f-num' }, 'Nummer / Inhalt'), h('input', { id: 'f-num', type: 'text', value: d.number, inputmode: 'text', autocomplete: 'off', oninput: e => { d.number = e.target.value; preview(); } }),
      ocrCands.length > 0 && h('div', { class: 'hint' }, 'Im Foto gelesene Zahlen – zum Übernehmen antippen:'),
      ocrCands.length > 0 && h('div', { class: 'chips' }, ocrCands.map(n => h('button', { type: 'button', class: 'chip' + (n === d.number ? ' on' : ''), onclick: () => { chooseNumber(n); draw(); } }, n)))));
    root.append(h('div', { class: 'field' }, h('label', {}, 'Anzeige'), seg([{ v: 'number', l: 'Nur Nummer' }, { v: 'qr', l: 'QR-Code' }, { v: 'barcode', l: 'Barcode' }], () => d.display, v => d.display = v)));
    if (d.display === 'barcode')
      root.append(h('div', { class: 'field' }, h('label', { for: 'f-fmt' }, 'Barcode-Format'),
        h('select', { id: 'f-fmt', onchange: e => { d.format = e.target.value; preview(); } }, Object.entries(WCodes.FORMATS).map(([k, f]) => h('option', { value: k, selected: d.format === k }, f.label)))));
    root.append(h('div', { class: 'field' }, h('div', { id: 'prev' })));
    root.append(h('div', { class: 'field' }, h('label', { for: 'f-url' }, 'Webseite (optional)'), h('input', { id: 'f-url', type: 'url', value: d.url, placeholder: 'www.beispiel.de', autocapitalize: 'none', oninput: e => d.url = e.target.value })));
    root.append(h('div', { class: 'field' }, h('label', {}, 'Design der Karte'),
      seg([{ v: 'photo', l: 'Foto', disabled: !d.photo }, { v: 'color', l: 'Farbe / Logo' }], () => d.design, v => d.design = v),
      h('div', { class: 'btnrow', style: 'margin-top:10px;align-items:center' },
        h('input', { type: 'color', value: d.color || '#0f766e', 'aria-label': 'Kartenfarbe', oninput: e => { d.color = e.target.value; } }),
        h('button', { type: 'button', class: 'btn', id: 'btn-logo', onclick: async e => {
          const b = e.currentTarget; b.disabled = true; b.textContent = 'Lade …';
          try { const r = await fetchLogoAndColor(d.url); d.logo = r.logo; if (r.color) d.color = r.color; d.design = 'color'; toast('Logo geladen.'); } catch (err) { toast(err.message, 5500); }
          draw();
        } }, 'Logo von Webseite laden')),
      h('div', { class: 'hint' }, 'Beim Laden des Logos wird die Adresse der Webseite an einen Favicon-Dienst (Google bzw. DuckDuckGo) gesendet. Alles andere bleibt auf deinem Gerät.'),
      d.logo && h('div', { class: 'photo-prev' }, h('img', { src: d.logo, alt: 'Logo', style: 'width:48px;aspect-ratio:1;object-fit:contain;background:#fff;padding:4px' }), h('button', { type: 'button', class: 'textbtn danger', onclick: () => { d.logo = ''; draw(); } }, 'Logo entfernen'))));
    preview(); ov.scrollTop = sy;
  }
  function preview() {
    const p = $('#prev', root); if (!p) return; p.replaceChildren();
    if (d.display === 'number' || !d.number) return;
    const { box, error } = codeBox(d); p.append(box); if (error) p.append(h('div', { class: 'err' }, error));
  }
  async function save() {
    d.name = (d.name || '').trim(); d.number = (d.number || '').trim();
    if (!d.name) { toast('Bitte einen Namen eingeben.'); return; }
    if (d.display !== 'number') { const r = WCodes.render(d.display, d.format, d.number); if (!r.ok) { toast(r.error, 5000); return; } }
    if (d.design === 'photo' && !d.photo) d.design = 'color';
    try {
      await DB.put(d);
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
      cards = await DB.all(); close(); renderList(); toast('Gespeichert.');
    } catch (e) { toast('Speichern fehlgeschlagen: ' + (e.message || e), 6000); }
  }
  draw();
}

/* ---------- Start ---------- */
$('#fileImport').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) importBackup(f); });
(async function init() {
  try { cards = await DB.all(); }
  catch (e) { $('#app').append(h('div', { class: 'empty' }, h('h2', {}, 'Speicher nicht verfügbar'), h('p', {}, 'Dieser Browser erlaubt kein lokales Speichern (privater Modus?). Öffne OtterCards in einem normalen Fenster.'))); return; }
  renderList();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    const hadController = !!navigator.serviceWorker.controller; let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || reloaded) return;          // erste Installation: nichts neu laden
      if (document.querySelector('.overlay')) { toast('Neue Version installiert – gilt ab dem nächsten Start.', 5000); return; }
      reloaded = true; location.reload();
    });
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
window.__ottercards = { WCodes, get cards() { return cards; } };
</script>
